function v11PatientProfile(){var d=v11Doctors.find(function(x){return x.id===v11Patient.doctorId})||v11Doctors[0];return '<div class="v11-login"><div class="mhead"><button class="btn sm" onclick="v11PatientTab(\'home\')">‹ 返回</button></div><div class="mcard"><h2>完善就诊人信息</h2><p class="sub">预约 '+d.name+' 医生 · '+d.dept+'。首次预约需完成实名信息。</p><div class="v11-form"><label>姓名 *</label><input id="v11Name" placeholder="请输入真实姓名"><label>性别 *</label><select id="v11Gender"><option>女</option><option>男</option></select><label>籍贯</label><input id="v11Birthplace" placeholder="省 / 市 / 区县"><label>手机号 *</label><input id="v11Phone" placeholder="请输入手机号"><label>身份证号码 *</label><input id="v11Id" placeholder="请输入身份证号码"><button class="btn primary" onclick="v11PatientSubmitProfile()">保存并继续预约</button></div>'+(v11Patient.notice?'<div class="v11-alert" style="margin-top:12px">'+v11Patient.notice+'</div>':'')+'</div></div>'}
function v11PatientBooking(){var d=v11Doctors.find(function(x){return x.id===v11Patient.doctorId})||v11Doctors[0];return '<div class="mhead"><button class="btn sm" onclick="v11PatientTab(\'home\')">‹ 返回医生列表</button></div><div class="mcard"><h2>确认预约</h2><div class="doctor-card"><span class="doc-avatar">'+d.photo+'</span><span><h3>'+d.name+' · '+d.title+'</h3><p>'+d.dept+' · '+d.intro+'</p></span></div><div class="v11-steps"><div class="v11-step done">选择医生</div><div class="v11-step cur">确认时段</div><div class="v11-step">预约成功</div></div><div class="v11-form"><label>就诊日期</label><select><option>2026-10-11（今日）</option></select><label>就诊时段</label><select><option>09:30–10:00 · 剩余 4 号</option><option>10:00–10:30 · 剩余 2 号</option></select><label>就诊人</label><input value="已完成实名信息" disabled><button class="btn primary" onclick="v11PatientSubmitBooking()">确认预约</button></div></div>'}
function v11PatientProgress(){var a=v11Patient.appointment;return '<div class="mhead"><div><h1>就诊进度</h1><span class="sub">预约、检查与报告状态</span></div></div><div class="mcard">'+(a?'<div class="doctor-card"><span class="doc-avatar">'+a.doctor.slice(0,1)+'</span><span><h3>'+a.doctor+' · '+a.dept+'</h3><p>'+a.time+' · 就诊序号 '+a.number+'</p></span></div><div class="v11-steps"><div class="v11-step done">预约成功</div><div class="v11-step cur">待到院签到</div><div class="v11-step">医生接诊</div><div class="v11-step">检查/报告</div></div><div class="v11-info">请按预约时间提前 30 分钟到院，签到后可在此查看候诊和报告进度。</div>':'<div class="v11-info">暂无进行中的预约。去预约页面选择今日专家。</div>')+'</div><div class="mcard"><h2>检查与报告</h2><div class="list"><div class="item"><div><b>胸部 CT</b><small>检查状态：待预约 · 影像科 CT-2 室</small></div>'+tag('待预约','warn')+'</div><div class="item"><div><b>报告查询</b><small>完成检查后，报告将回传至进度页</small></div>'+tag('待生成','gray')+'</div></div></div>'+v11PatientBottom('progress')+'</div>'}
function v11PatientMine(){return '<div class="mhead"><div><h1>我的</h1><span class="sub">就诊人信息与预约记录</span></div></div><div class="mcard"><div class="doctor-card"><span class="doc-avatar">'+(v11Patient.profileComplete?'我':'未')+'</span><span><h3>'+(v11Patient.profileComplete?'已绑定就诊人':'未完善实名信息')+'</h3><p>'+(v11Patient.profileComplete?'可继续预约和查看报告':'预约前需完成实名信息')+'</p></span></div>'+(!v11Patient.profileComplete?btn('完善信息',"v11PatientOpenDoctor('DOC-01')",'btn primary'):'')+'</div><div class="mcard"><div class="item"><div><b>预约记录</b><small>查看历史预约和取消状态</small></div>'+btn('查看',"v11PatientTab('progress')",'btn primary')+'</div><div class="item"><div><b>就诊人管理</b><small>当前支持本人就诊信息</small></div>'+btn('管理',"openInfo('就诊人管理','当前原型支持本人实名信息维护。')")+'</div><div class="item"><div><b>消息与提醒</b><small>预约、候诊、报告提醒</small></div>'+btn('查看',"openInfo('消息中心','已展示 2 条预约提醒。')")+'</div></div>'+v11PatientBottom('mine')+'</div>'}

function v11PatientLoginPage(){return '<div class="v11-login"><div class="brandmark">医路协同</div><div class="subtitle">患者诊疗流程协同服务<br>预约专家、查看进度、接收报告提醒</div><div class="mcard"><h2>登录后开始预约</h2><button class="btn primary" onclick="v11PatientLogin(\'wechat\')">微信快捷登录</button><button class="btn" onclick="v11PatientLogin(\'sms\')">手机验证码登录</button><p class="sub" style="margin-top:14px">登录即表示同意就诊服务和隐私保护说明</p></div></div>'}
