const respiratoryDiseases=['肺部感染','慢性阻塞性肺疾病急性加重','支气管哮喘急性发作','支气管扩张伴感染','社区获得性肺炎','肺部占位待查','间质性肺疾病'];

const wardPatients=patients.map((p,i)=>{const e=respiratoryExams[i%respiratoryExams.length],phase=i%5,check=['检查中','待检查','准备完成','检查已完成','检查已完成'][phase],report=['待出结果','待出结果','待出结果','报告已出','危急值'][phase];return {...p,disease:respiratoryDiseases[i%respiratoryDiseases.length],exam:e[0],location:e[1],prep:e[2],check,report,reportTime:report==='待出结果'?'—':`${String(10+i%6).padStart(2,'0')}:${['05','20','35','50'][i%4]}`,task:phase===3?'已完成':phase===4?'处理中':phase===2?'处理中':'待处理',taskText:phase===3?'检查已完成，等待报告生成':phase===4?'危急值已通知医生，等待处置确认':phase===2?'检查准备已完成，等待送出患者':'待确认检查准备和身份核对'}});

 lab:['检验科工作台','待做报告','报告详情','已发送报告','检验消息中心','检验操作审计'],

 patient:['患者首页','账号登录','选择就诊人','预约挂号首页','选择日期','选择科室','选择医生','选择号源','确认预约','预约成功','预约记录','检查预约首页','选择检查项目','选择检查时间','检查预约成功','检查准备事项','就诊进度','候诊叫号','报告列表','报告详情','报告时间轴','消息中心','复诊安排','家属管理']
};
const roleNames={nurse:'住院护士端',outpatient:'门诊护士端',doctor:'医生端',lab:'检验科端',admin:'管理端',patient:'患者及家属端'};
const app={role:'nurse',route:'nurse-0',patientId:patients[0].id,filter:'all',search:'',disease:'全部疾病类型',page:1,taskFilter:'all',reportTab:'all',bookingStep:1,bookingPatientId:null,bookingProject:null,bookingTime:null,analytics:'检查量',period:'今日'};
const el=id=>document.getElementById(id);const side=el('side'),topbar=el('top'),page=el('page'),mobile=el('mobile');
el('role').innerHTML=Object.entries(roleNames).map(([id,name])=>`<option value="${id}">${name}</option>`).join('');el('role').value=app.role;el('count').textContent=Object.values(roles).reduce((n,a)=>n+a.length,0);
el('role').onchange=()=>{closeModal();closeDrawer();app.role=el('role').value;app.route=`${app.role}-0`;app.search='';app.page=1;if(app.role==='patient'){side.classList.add('hide');topbar.classList.add('hide');page.classList.add('hide');mobile.classList.remove('hide');renderPatient(0)}else{side.classList.remove('hide');topbar.classList.remove('hide');page.classList.remove('hide');mobile.classList.add('hide');render()}};
function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function pById(id){const source=app.role==='nurse'?wardPatients:patients;return source.find(p=>p.id===id)||source[0]}
function btn(label,action,cls='btn sm'){return `<button class="${cls}" onclick="${action}">${label}</button>`}function tag(text,type='info'){return `<span class="tag ${type}">${text}</span>`}
function title(h,sub,actions=''){return `<div class="title"><div><h1>${h}</h1><p>${sub}</p></div><div class="actions">${actions}</div></div>`}function stat(label,value,sub,go,klass=''){const action=go||`openInfo('${label}','${sub||'当前指标'}')`;return `<button class="stat" onclick="${action}"><label>${label}</label><strong>${value}</strong><small class="${klass}">${sub}</small></button>`}
function chart(values,labels){return `<div class="chart">${values.map((v,i)=>`<div class="bar" style="height:${Math.max(v,24)}px"><em>${v}</em><span>${labels[i]}</span></div>`).join('')}</div>`}function pager(total){const max=Math.ceil(total/8)||1;return `<div class="pagination"><span>共 ${total} 条数据　当前第 ${app.page} / ${max} 页</span><div class="pages">${Array.from({length:max},(_,i)=>btn(i+1,`setPage(${i+1})`,`btn sm ${app.page===i+1?'primary':''}`)).join('')}</div></div>`}
function render(){const [role,index]=app.route.split('-');const i=Number(index),name=roles[role][i];renderNav();el('crumb').textContent=`${roleNames[role]} / ${name}`;if(role==='nurse')page.innerHTML=renderNurse(i);else if(role==='admin')page.innerHTML=renderAdmin(i);else page.innerHTML=renderRole(role,i)}

function go(route,opts={}){Object.assign(app,opts);app.route=route;if(!opts.keepPage)app.page=1;render()}
function nursePatients(filter=app.filter){const q=app.search.trim().toLowerCase();let list=wardPatients.filter(p=>filter==='all'||filter==='exam'?p.check!=='已完成':filter==='report'?p.report==='报告已出'||p.report==='危急值':filter==='critical'?p.report==='危急值':filter==='follow'?p.follow==='待复诊':true);if(app.disease&&app.disease!=='全部疾病类型')list=list.filter(p=>p.disease===app.disease);if(q)list=list.filter(p=>p.name.includes(q)||p.id.toLowerCase().includes(q));return list}
function dashboard(){const examCount=wardPatients.filter(p=>p.check!=='检查已完成').length,reportCount=wardPatients.filter(p=>p.report==='报告已出'||p.report==='危急值').length,critical=wardPatients.filter(p=>p.report==='危急值').length,follow=wardPatients.filter(p=>p.follow==='待复诊').length;return title('病区工作台','8A 呼吸内科病区 · 当前班次 08:00–16:00',btn('刷新患者状态',"refreshNurse()",'btn primary'))+`<div class="stats">${stat('在院患者',36,'点击查看完整住院信息',"go('nurse-1',{filter:'all'})",'up')}${stat('今日待检查',examCount,'项目、地点、时间、准备事项',"go('nurse-1',{filter:'exam'})")}${stat('报告待查看',reportCount,'已出报告与危急值',"go('nurse-6',{reportTab:'ready'})")}${stat('危急值待处理',critical,'点击进入处置闭环',"go('nurse-6',{reportTab:'critical'})",'down')}${stat('待复诊安排',follow,'可直接带入门诊预约',"go('nurse-1',{filter:'follow'})")}</div><div class="grid"><div class="card"><div class="head"><h2>患者任务列表</h2>${btn('查看全部',"go('nurse-1',{filter:'all'})")}</div>${taskTable(wardPatients.slice(0,6),true)}</div><div><div class="card"><div class="head"><h2>15 分钟内检查提醒</h2>${tag('2 项','warn')}</div><div class="list">${wardPatients.filter((_,i)=>i<2).map(p=>`<div class="item"><div><b>${p.id} ${p.name} · ${p.exam}</b><small>${p.time} · ${p.location} · ${p.prep}</small></div>${btn('完成准备',`completePrep('${p.id}')`,'btn warn')}</div>`).join('')}</div>${btn('查看检查时间表',"go('nurse-5')")}</div><div class="card"><div class="head"><h2>报告进度</h2>${btn('查看全部',"go('nurse-6')")}</div>${chart([3,5,4,7,6,8],['08','10','12','14','16','18'])}</div></div></div>`}
function taskTable(list,compact=false){return `<div class="tablewrap"><table class="table"><thead><tr><th>📌住院号/床位</th><th>患者与疾病类型</th><th>检查项目</th><th>检查安排</th><th>当前任务</th><th>状态</th><th>操作</th></tr></thead><tbody>${list.map(p=>{const scheduleAction=app.route==='nurse-5'?(p.check==='检查中'?btn('查看检查中',`openPatient('${p.id}')`,'btn sm primary'):btn('完成准备并送出',`completePrep('${p.id}')`,'btn sm warn')):'';return `<tr><td><b>${p.id}</b><br><span class="sub">${p.id.slice(0,2)}楼${p.id[2]}病区${Number(p.id.slice(-2))}号床</span></td><td><b>${p.name}</b><br><span class="sub">${p.gender} · ${p.age}岁 · ${p.disease}</span></td><td>${p.exam}</td><td>${p.location}<br><span class="sub">${p.time} · ${p.prep}</span></td><td>${p.taskText}</td><td>${statusTag(p.task)}</td><td>${btn('查看详情',`openPatient('${p.id}')`)} ${scheduleAction} ${p.follow==='待复诊'?btn('预约复诊',`startFollowup('${p.id}')`):''}</td></tr>`}).join('')}</tbody></table></div>`}

function patientManagement(){const list=nursePatients(),start=(app.page-1)*8,shown=list.slice(start,start+8);return title('患者管理','本病区所有待检查、待报告和待复诊患者',btn('手工新增患者',"go('nurse-11')",'btn primary'))+`<div class="tabs">${[['all','全部在院患者'],['exam','今日待检查'],['report','报告待查看'],['critical','危急值'],['follow','待复诊安排']].map(([k,n])=>`<button class="${app.filter===k?'on':''}" onclick="setFilter('${k}')">${n}（${nursePatients(k).length}）</button>`).join('')}</div><div class="card"><div class="filters"><input value="${esc(app.search)}" placeholder="搜索患者姓名或住院号，如 8A01" oninput="searchPatients(this.value)"><select onchange="setDisease(this.value)"><option ${app.disease==='全部疾病类型'?'selected':''}>全部疾病类型</option>${diseases.map(x=>`<option ${app.disease===x?'selected':''}>${x}</option>`).join('')}</select>${btn('清除筛选',"clearPatientFilter()")}</div>${taskTable(shown)}${pager(list.length)}</div>`}
function patientDetail(){const p=pById(app.patientId);return title('患者详情',`${p.id} · ${p.name} · ${p.disease}`,btn('返回患者管理',"go('nurse-1')")+btn('新增节点',"openAddNode()",'btn primary'))+`<div class="grid"><div><div class="card"><div class="head"><h2>基本信息</h2>${tag(p.check,'info')}</div><div class="fieldgrid"><div class="field"><label>住院号/床位</label><strong>${p.id}</strong></div><div class="field"><label>患者姓名</label><strong>${p.name} · ${p.gender} · ${p.age}岁</strong></div><div class="field"><label>疾病类型</label><strong>${p.disease}</strong></div><div class="field"><label>检查项目</label><strong>${p.exam}</strong></div><div class="field"><label>检查地点与时间</label><strong>${p.location} · ${p.time}</strong></div><div class="field"><label>检查准备</label><strong>${p.prep}</strong></div></div></div><div class="card"><div class="head"><h2>患者检查时间轴</h2>${btn('新增节点',"openAddNode()")}</div><div class="timeline"><div class="step done">检查申请</div><div class="step done">预约完成</div><div class="step cur">${p.check}</div><div class="step">报告</div><div class="step">复诊</div></div><div class="list"><div class="item"><div><b>${p.time} · ${p.exam} ${p.check}</b><small>${p.location}；${p.prep}</small></div>${statusTag(p.task)}</div><div class="item"><div><b>${p.reportTime} · 报告 ${p.report}</b><small>医生查看状态：${p.report==='报告已出'?'待查看':'等待结果'}</small></div>${tag(p.report,p.report==='危急值'?'bad':p.report==='报告已出'?'warn':'gray')}</div></div></div></div><div><div class="card"><div class="head"><h2>快捷操作</h2></div><div class="actions">${btn('通知医生',`confirmNotify('${p.id}')`,'btn primary')}${btn('安排复诊',`startFollowup('${p.id}')`)}${btn('打印摘要',`openPrint('${p.id}')`)}</div></div><div class="card"><div class="head"><h2>待处理事项</h2>${statusTag(p.task)}</div><div class="message"><b>${p.taskText}</b><br>责任护士：李护士；检查前 15 分钟会在消息中心提醒。</div></div></div></div>`}
function nurseTasks(){let list=patients.filter(p=>app.taskFilter==='all'||p.task===app.taskFilter),q=app.search.trim();if(q)list=list.filter(p=>p.name.includes(q)||p.id.includes(q));const shown=list.slice((app.page-1)*8,app.page*8);return title('护理任务','每个状态均显示具体任务、处理进度和完成结果',btn('新建护理任务',"openTaskForm()",'btn primary')+btn('导出任务清单',"openExport('护理任务清单',patients)",''))+`<div class="tabs">${['all','待处理','处理中','已完成'].map(k=>`<button class="${app.taskFilter===k?'on':''}" onclick="setTaskFilter('${k}')">${k==='all'?'全部任务':k}（${k==='all'?patients.length:patients.filter(p=>p.task===k).length}）</button>`).join('')}</div><div class="card"><div class="filters"><select onchange="setTaskDepartment(this.value)"><option>全部科室</option><option>影像科</option><option>超声科</option><option>检验科</option></select><input value="${esc(app.search)}" oninput="searchTasks(this.value)" placeholder="搜索患者姓名或住院号">${btn('应用筛选',"render()",'btn primary')}</div><div class="tablewrap"><table class="table"><thead><tr><th>患者</th><th>状态</th><th>待处理/处理中/完成事项</th><th>责任人</th><th>下一步</th><th>操作</th></tr></thead><tbody>${shown.map(p=>`<tr><td><b>${p.id} ${p.name}</b><br><span class="sub">${p.disease}</span></td><td>${statusTag(p.task)}</td><td>${p.task==='待处理'?'确认身份、空腹与金属物品清除':p.task==='处理中'?'已联系检查科，等待转运人员到位':'已完成检查准备、送出并签收'}</td><td>李护士</td><td>${p.task==='待处理'?'完成检查准备':p.task==='处理中'?'确认患者已送达':'查看报告进度'}</td><td>${btn('查看详情',`openPatient('${p.id}')`)} ${p.task!=='已完成'?btn('推进任务',`advanceTask('${p.id}')`,'btn primary'):''}</td></tr>`).join('')}</tbody></table></div>${pager(list.length)}</div><div class="card"><div class="head"><h2>任务状态说明与交互</h2></div><div class="grid two"><div class="message"><b>待处理</b><br>表示尚未完成身份核对或检查准备；可点击“推进任务”进入处理中。</div><div class="message"><b>处理中</b><br>表示已经联系检查科或转运；可确认送出患者，进入检查中。</div><div class="message"><b>已完成</b><br>表示准备、送出和签收均完成；可转至报告进度查看结果。</div><div class="message"><b>加载/空/失败/权限</b><br>用于展示系统在数据同步中、无任务、接口异常或权限不足时的真实页面状态；点击下方进入对应页面。</div></div><div class="actions">${btn('加载中页面',"openState('loading')")}${btn('无任务页面',"openState('empty')")}${btn('同步失败页面',"openState('error')")}${btn('权限不足页面',"openState('permission')")}</div></div>`}
function booking(){const p=app.bookingPatientId?pById(app.bookingPatientId):null;let content='';if(app.bookingStep===1){const list=patients.filter(x=>x.follow==='待复诊'||x.check!=='已完成');content=`<div class="card"><div class="head"><h2>步骤 1：选择或录入患者</h2>${btn('手工新增患者',"go('nurse-11')")}</div><div class="filters"><input value="${esc(app.search)}" placeholder="搜索姓名或住院号" oninput="bookingSearch(this.value)"></div><div class="list">${list.filter(x=>!app.search||x.name.includes(app.search)||x.id.includes(app.search)).slice(0,12).map(x=>`<div class="item"><div><b>${x.id} ${x.name}</b><small>${x.disease} · ${x.exam} · ${x.check}</small></div>${btn('选择患者',`chooseBookingPatient('${x.id}')`,'btn primary')}</div>`).join('')}</div></div>`}else if(app.bookingStep===2){content=`<div class="grid two"><div class="card"><div class="head"><h2>步骤 2：填写检查预约</h2><span class="sub">患者：${p.name} / ${p.id}</span></div><div class="fieldgrid"><div class="field"><label>检查项目</label><select id="bookProject">${exams.map(e=>`<option>${e[0]}</option>`).join('')}</select></div><div class="field"><label>检查地点</label><select id="bookLocation">${exams.map(e=>`<option>${e[1]}</option>`).join('')}</select></div><div class="field"><label>预约日期</label><input id="bookDate" type="date" value="2026-10-09"></div><div class="field"><label>预约时间</label><select id="bookTime"><option>09:00</option><option>09:30</option><option>10:00</option><option>14:00</option></select></div></div></div><div class="card"><div class="head"><h2>检查准备核对</h2></div><div class="message"><b>检查前准备：</b>空腹、清除金属物品、腕带核对等规则会随检查项目同步变化。</div><label class="message"><input id="prepDone" type="checkbox"> 已向患者/家属完成检查准备宣教</label><label class="message"><input id="identityDone" type="checkbox"> 已核对患者姓名、住院号和腕带</label></div></div>`}else{content=`<div class="card"><div class="head"><h2>预约成功</h2>${tag('已同步患者端','good')}</div><div class="fieldgrid"><div class="field"><label>患者</label><strong>${p.name} / ${p.id}</strong></div><div class="field"><label>预约项目</label><strong>${app.bookingProject||p.exam}</strong></div><div class="field"><label>检查时间</label><strong>${app.bookingTime||'2026-10-09 09:00'}</strong></div><div class="field"><label>患者端提醒</label><strong>已发送检查地点、时间和准备事项</strong></div></div><div class="callout"><span>预约内容已写入患者端“检查预约”和“消息中心”。</span>${btn('查看患者端同步内容',"openPatientSync()")}</div></div>`}return title('预约检查','完整流程：选择患者 → 填写项目与准备 → 成功并同步患者端',app.bookingStep===3?btn('新建预约',"resetBooking()",'btn primary'):'')+`<div class="timeline"><div class="step ${app.bookingStep>1?'done':app.bookingStep===1?'cur':''}">选择患者</div><div class="step ${app.bookingStep>2?'done':app.bookingStep===2?'cur':''}">检查预约</div><div class="step ${app.bookingStep===3?'cur':''}">预约成功与同步</div></div>${content}<div class="actions">${app.bookingStep>1?btn('上一步',"bookingBack()") : ''}${app.bookingStep===1?'':app.bookingStep===2?btn('确认预约并同步患者端',"bookingConfirm()",'btn primary'):btn('前往检查时间表',"go('nurse-5')",'btn primary')}</div>`}
function schedule(){const list=patients.filter(p=>p.check!=='已完成');return title('检查时间表与准备','合并检查准备页面；提前 15 分钟提醒，完成准备后进入“检查中”',btn('查看全部检查进度',"go('nurse-6')"))+`<div class="card"><div class="callout"><span><b>当前提醒：</b>2 名患者将在 15 分钟内检查，需完成准备核对并送出患者。</span>${btn('查看消息中心',"openMessages()",'btn warn')}</div>${taskTable(list.slice(0,12))}</div>`}
function reportProgress(){let list=app.reportTab==='all'?patients:app.reportTab==='ready'?patients.filter(p=>p.report==='报告已出'):app.reportTab==='await'?patients.filter(p=>p.report==='待出结果'||p.report==='报告待审核'):patients.filter(p=>p.report==='危急值');return title('报告进度与危急值','检查完成、报告生成、医生查看和危急值处置统一管理',btn('查看危急值历史',"go('nurse-7')"))+`<div class="tabs">${[['all','全部报告'],['await','待出结果'],['ready','报告待查看'],['critical','危急值处理']].map(([k,n])=>`<button class="${app.reportTab===k?'on':''}" onclick="setReportTab('${k}')">${n}（${k===app.reportTab?list.length:k==='all'?patients.length:k==='ready'?patients.filter(p=>p.report==='报告已出').length:k==='await'?patients.filter(p=>p.report==='待出结果'||p.report==='报告待审核').length:patients.filter(p=>p.report==='危急值').length}）</button>`).join('')}</div><div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>患者</th><th>检查项目</th><th>报告进度</th><th>报告时间</th><th>医生查看</th><th>护士操作</th></tr></thead><tbody>${list.map(p=>`<tr><td><b>${p.id} ${p.name}</b><br><span class="sub">${p.disease}</span></td><td>${p.exam}</td><td>${tag(p.report,p.report==='危急值'?'bad':p.report==='报告已出'?'warn':'gray')}</td><td>${p.report==='待出结果'?'—':p.reportTime}</td><td>${p.report==='报告已出'||p.report==='危急值'?tag(p.report==='危急值'?'待确认':'待查看',p.report==='危急值'?'bad':'warn'):'—'}</td><td>${p.report==='危急值'?btn('立即处置',`openCritical('${p.id}')`,'btn bad'):p.report==='报告已出'?btn('提醒医生',`confirmNotify('${p.id}')`):btn('查看患者',`openPatient('${p.id}')`)}</td></tr>`).join('')}</tbody></table></div></div>`}
function criticalHistory(){const list=patients.filter(p=>p.report==='危急值');return title('危急值历史','历史患者的危急值、响应时间和处理时间',btn('导出历史记录',"openExport('危急值历史',patients.filter(p=>p.report==='危急值'))"))+`<div class="stats">${stat('本月危急值',list.length,'较上月 -2','', 'up')}${stat('平均响应时间','7 分钟','目标 ≤15分钟','', 'up')}${stat('平均处置时间','19 分钟','从报告到医生确认','', 'up')}${stat('超时事件','0','当前无超时','', 'up')}${stat('短信送达率','98.6%','第一联系人提醒','', 'up')}</div><div class="grid"><div class="card"><div class="head"><h2>危急值响应趋势</h2><span class="sub">近 7 日（分钟）</span></div>${chart([9,7,11,6,8,7,5],['周一','周二','周三','周四','周五','周六','周日'])}</div><div class="card"><div class="head"><h2>事件分布</h2></div><div class="ringbox"><div class="ring"></div><strong>100%</strong></div><div class="legend"><span><i></i>已闭环</span><span><i class="g"></i>处理中</span><span><i class="y"></i>复盘中</span></div></div></div><div class="card">${criticalTable(list)}</div>`}
function criticalTable(list){return `<div class="tablewrap"><table class="table"><thead><tr><th>患者</th><th>危急值项目</th><th>报告时间</th><th>响应时间</th><th>处置时间</th><th>处理结果</th><th>操作</th></tr></thead><tbody>${list.map((p,i)=>`<tr><td>${p.id} ${p.name}</td><td>${p.exam}</td><td>${p.reportTime}</td><td>${6+i} 分钟</td><td>${17+i} 分钟</td><td>${tag('已闭环','good')}</td><td>${btn('查看处置记录',`openCritical('${p.id}')`)}</td></tr>`).join('')}</tbody></table></div>`}
